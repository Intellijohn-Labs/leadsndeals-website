# Nginx config for the Leadsndeals website on leadsndeals.com
# Copy to /etc/nginx/sites-available/leadsndeals.com, enable it, then run certbot (see README).
# The site itself runs under PM2 on port 3030 (ecosystem.config.cjs).

# www.leadsndeals.com  ->  leadsndeals.com
server {
    listen 80;
    server_name www.leadsndeals.com;
    return 301 https://leadsndeals.com$request_uri;
}

# leadsndeals.com  ->  the website (Next.js on port 3030)
server {
    listen 80;
    server_name leadsndeals.com;

    # Voice clips for Malayalam transcription are up to ~1.5 MB
    client_max_body_size 4m;

    # Next.js build assets never change (file names include a hash): cache them for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Lia's answers stream word by word: don't buffer them
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
